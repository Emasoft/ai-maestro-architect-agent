[project]
name = "ai-maestro-architect-agent"
version = "2.16.0"
description = "Design documents, requirements analysis, architecture decisions - creates specifications."
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
dev = ["pyyaml"]

# The fail-fast ratchet (TRDD-DMIRQOCD step 4): these four rules are the
# swallowed-failure shapes the project's error policy forbids (blind except,
# try-except-pass, unchecked subprocess exit, wrong exception class). The
# tree reports ZERO for them as of the burn-down; extend-select keeps ruff's
# defaults intact and ADDS these so the policy can never drift back unmeasured.
# (extend-select, never select — select REPLACES the defaults and guts the gate.)
[tool.ruff.lint]
extend-select = ["BLE001", "S110", "PLW1510", "TRY004"]
# DTZ005: naive datetime.now() is DELIBERATE project-wide — the timestamp
# policy (agent-reports-location rule) mandates LOCAL wall-clock time in
# filenames and frontmatter; every use feeds a strftime where tz-awareness
# changes nothing. A policy-wide decision belongs in config, not 27 noqas.
ignore = ["DTZ005"]

# E402 in these files is BY DESIGN: they must extend sys.path to reach the
# repo-root lib/ helpers before importing them (TRDD-WDM195GD), so the import
# cannot sit at top-of-file. Config-level ignore instead of per-line noqa
# because E402 is a default rule at the pinned gate (0.15.20) but NOT at the
# adoption target (0.16.3) — inline noqa comments are "used" at one version
# and RUF100-stale at the other; the config form is stable across both.
[tool.ruff.lint.per-file-ignores]
"scripts/amaa_design_search.py" = ["E402"]
"skills/amaa-planning-patterns/scripts/*.py" = ["E402"]
